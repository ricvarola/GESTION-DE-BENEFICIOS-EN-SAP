            if (sev === "Crítico") return "bg-rose-500/20 border-rose-500/30 text-rose-400";

            if (sev === "Medio" || sev === "Media") return "bg-amber-500/20 border-amber-500/30 text-amber-400";
            if (sev === "Bajo" || sev === "Baja") return "bg-emerald-500/20 border-emerald-500/30 text-emerald-400";
            return "bg-slate-700/50 border-slate-600/50 text-slate-300";
        }

            if (sev === "Crítico") return "bg-rose-50 border-rose-200 text-rose-700";
            if (sev === "Alto" || sev === "Alta") return "bg-orange-50 border-orange-200 text-orange-700";

            if (sev === "Bajo" || sev === "Baja") return "bg-emerald-50 border-emerald-200 text-emerald-700";

        }

            if (status === 'Cerrado') return 'text-emerald-700 bg-emerald-100 border border-emerald-200';
            if (status === 'Error' || status === 'Desestimado') return 'text-rose-700 bg-rose-100 border border-rose-200';
            if (status === 'Pruebas en QAS' || status === 'Revisión' || status === 'Pruebas Unitarias') return 'text-amber-700 bg-amber-100 border border-amber-200';
            if (status === 'Inicio') return 'text-slate-600 bg-slate-100 border border-slate-200';
            return 'text-blue-700 bg-blue-100 border border-blue-200';
        }

        const formatDate = (val) => {
            if (!val) return 'N/A';
            const [y, m, d] = val.split('-');
            return `${d}/${m}/${y}`;
        }

        const getGapDays = (estObj) => {
            if (!estObj || !estObj.show || !estObj.val) return null;
            const estDate = new Date(estObj.val + "T00:00:00").getTime();
            if (isNaN(estDate)) return null;
            const today = new Date().setHours(0, 0, 0, 0);
            const diff = estDate - today;
            return Math.round(diff / (1000 * 3600 * 24));
        }

        function App() {
            const [isDark, setIsDark] = useState(false);

            useEffect(() => {
                if (isDark) document.body.classList.add('dark');
                else document.body.classList.remove('dark');
            }, [isDark]);

            const [view, setView] = useState('dashboard');
            const [isLoading, setIsLoading] = useState(true);
            const [isSaving, setIsSaving] = useState(false);
            const [isAuth, setIsAuth] = useState(false);
            const [passInput, setPassInput] = useState('');
            const [showAuthGate, setShowAuthGate] = useState(false);
            const [authTimeout, setAuthTimeout] = useState(0); 
            const [lastExitTime, setLastExitTime] = useState(0);
            const [expandedMacros, setExpandedMacros] = useState(['G1', 'G2', 'G3']);
            const [popupFilter, setPopupFilter] = useState(null);

            const [data, setData] = useState(INITIAL_DATA);
            const [tempData, setTempData] = useState(null);

            // --- SINCRONIZACIÓN FIREBASE COMPAT (CON TIEMPO DE ESPERA) ---
            useEffect(() => {
                let timer = setTimeout(() => {
                    if (isLoading) {
                        console.warn("La nube no responde. Cargando datos locales...");
                        const saved = localStorage.getItem('checkpoint_sap_master_v1');
                        if (saved) setData(JSON.parse(saved));
                        setIsLoading(false);
                    }
                }, 5000);

                if (projectDoc) {
                    const unsub = projectDoc.onSnapshot((docSnap) => {
                        clearTimeout(timer);
                        if (docSnap.exists) {
                            setData(docSnap.data());
                        } else {
                            projectDoc.set(INITIAL_DATA);
                        }
                        setIsLoading(false);
                    }, (error) => {
                        console.error("Firebase Sync Error:", error);
                        setIsLoading(false);
                        const saved = localStorage.getItem('checkpoint_sap_master_v1');
                        if (saved) setData(JSON.parse(saved));
                    });
                    return () => { unsub(); clearTimeout(timer); };
                } else {
                    setIsLoading(false);
                }
            }, []);

            const handleEditEnter = () => {
                const now = Date.now();
                const sessionExpired = authTimeout === 0 || (now - lastExitTime) > (authTimeout * 60 * 1000);

                if (isAuth && !sessionExpired) {
                    setTempData(JSON.parse(JSON.stringify(data)));
                    setView('editor');
                } else {
                    setIsAuth(false);
                    setShowAuthGate(true);
                }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (passInput === '5555') {
                    setIsAuth(true);
                    setShowAuthGate(false);
                    setTempData(JSON.parse(JSON.stringify(data)));
                    setView('editor');
                    setPassInput('');
                } else {
                    alert('Clave incorrecta');
                }
            };

            useEffect(() => {
                if (view === 'dashboard' && tempData) {
                    // We just left the editor
                    setLastExitTime(Date.now());
                }
            }, [view]);

            const handleSave = async () => {
                if (isSaving) return;
                try {
                    setIsSaving(true);
                    const finalData = JSON.parse(JSON.stringify(tempData));

                    finalData.macros.forEach(macro => {
                        if (macro.dismissed) {
                            macro.deliverables.forEach(d => { d.dismissed = true; });
                        }
                        const activeDeliverables = macro.deliverables.filter(d => !d.dismissed);
                        let totalProgress = 0;
                        activeDeliverables.forEach(d => { totalProgress += Number(d.progress) || 0; });
                        const avg = activeDeliverables.length > 0 ? Math.round(totalProgress / activeDeliverables.length) : 0;
                        macro.progress = avg;
                        if (avg === 100) macro.color = "#10b981";
                        else if (macro.dismissed) macro.color = "#94a3b8";
                        else macro.color = "#3b82f6";
                    });

                today.setHours(0, 0, 0, 0);
                const due = new Date(dueDateStr);
                due.setHours(0, 0, 0, 0);
                const daysLeft = Math.ceil((due.getTime() - today.getTime()) / (1000 * 3600 * 24));

                if (daysLeft < 0) return '#e11d48'; // overdue -> red
                if (daysLeft <= 15 && progress <= 50) return '#e11d48'; // incredibly close and very delayed -> red

                        const formatName = pointDate.toLocaleDateString('es-ES', { month: 'short', year: '2-digit' });

                            <div className="bg-white p-6 rounded-[24px] shadow-sm border border-slate-200/60">
                                <h3 className="text-xs font-black text-slate-500 uppercase tracking-widest mb-6 flex items-center gap-2"><span className="text-orange-500"><IconTrendingDown /></span> Análisis de Desvío (GAP)</h3>
                                <div className="flex justify-between items-end mb-3">
                                    <div>
                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-0.5">Teórico Dinámico</p>
                                        <p className="text-2xl font-black text-slate-800">{targetProgress}%</p>
                                    </div>
                                    <div className="text-right">
                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-0.5">Avance Físico (Real)</p>
                                        <div className="flex items-center justify-end gap-2">
                                            <span className={`text-xs font-black px-1.5 py-0.5 rounded ${targetProgress - dynamicOverallProgress > 0 ? "text-rose-500 bg-rose-50" : "text-green-600 bg-green-50"}`}>
                                                {dynamicOverallProgress - targetProgress > 0 ? '+' : ''}{dynamicOverallProgress - targetProgress}%
                                            </span>
                                            <p className="text-2xl font-black text-slate-800">{dynamicOverallProgress}%</p>
                                        </div>
                                    </div>
                                </div>
                                <div className="relative h-2 w-full bg-slate-100 rounded-full overflow-hidden mt-6 mb-5 flex shadow-inner">
                                    <div className="h-full bg-blue-600 relative z-10 rounded-full" style={{ width: `${dynamicOverallProgress}%` }}></div>
                                    {targetProgress > dynamicOverallProgress && <div className="h-full bg-amber-400 opacity-50 absolute" style={{ left: `${dynamicOverallProgress}%`, width: `${targetProgress - dynamicOverallProgress}%` }}></div>}
                                </div>
                                <div className="p-4 bg-orange-50/50 border border-orange-100/50 rounded-[16px] flex gap-3 items-start">
                                    <div className="text-orange-500 mt-1 shrink-0"><IconInfo /></div>
                                    <p className="text-[10px] font-bold text-slate-500 leading-relaxed">{deviationExplanation}</p>
                                </div>
                            </div>

                            {/* Riesgos Guardados */}
                            <div className="bg-white p-6 rounded-[24px] shadow-sm border border-slate-200/60">
                                <h3 className="text-xs font-black text-slate-500 uppercase tracking-widest mb-6 flex items-center gap-2"><span className="text-orange-500"><IconShieldAlert /></span> Riesgos Técnicos y Alertas</h3>
                                <div className="space-y-3">
                                    {(!data.risks || data.risks.length === 0) ? (
                                        <div className="text-xs text-center text-slate-400 py-4 italic">No hay riesgos identificados.</div>
                                    ) : (
                                        data.risks.map((risk, i) => (
                                            <div key={i} className={`p-4 rounded-xl border flex flex-col gap-2 ${risk.resolved ? 'bg-slate-50 border-slate-200 text-slate-400' : getSeverityStyleLight(risk.severity)}`}>
                                                <div className="flex justify-between items-start">
                                                    <h4 className={`text-xs font-black uppercase tracking-tight leading-tight w-3/4 ${risk.resolved ? 'line-through opacity-40' : ''}`}>{risk.title}</h4>
                                                    <span className="text-[9px] font-black bg-white/70 px-2 py-0.5 rounded-full border border-black/5 tracking-widest shadow-sm">{risk.severity}</span>
                                                </div>
                                                <p className={`text-xs opacity-80 mt-1 leading-relaxed ${risk.resolved ? 'line-through opacity-50' : ''}`}>{risk.desc}</p>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>

                            {/* Equipo */}
                            <div className="bg-white p-6 rounded-[24px] shadow-sm border border-slate-200/60">
                                <h3 className="text-xs font-black text-slate-500 uppercase tracking-widest flex items-center justify-between mb-6">
                                    <span className="flex items-center gap-2"><span className="text-blue-500"><IconUsers /></span> Equipo Responsable</span>
                                </h3>
                                <div className="space-y-1 custom-scrollbar max-h-64 overflow-y-auto">
                                    {data.team.map((member, i) => (
                                        <div key={i} onClick={() => setPopupFilter({ type: 'user', value: member.name })} className="flex flex-row items-center justify-between p-3 hover:bg-slate-50 rounded-xl transition-colors border border-transparent hover:border-slate-100 cursor-pointer">
                                            <div className="flex items-center gap-3">
                                                <div className="w-9 h-9 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-600 font-black text-sm shadow-sm">{(member.name || "?").charAt(0).toUpperCase()}</div>
                                                <div>
                                                    <p className="text-xs font-bold text-slate-800">{member.name}</p>
                                                    <p className="text-[10px] font-medium text-slate-500 mt-0.5">{member.role}</p>
                                                </div>
                                            </div>
                                            <div className="text-[9px] font-black text-blue-600 bg-blue-50 px-2 py-1 rounded-md uppercase tracking-wider border border-blue-100">{member.org}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </main >
                    {(data.footerText && data.footerText.trim() !== '') && (
                        <div className="max-w-[1400px] mx-auto px-6 mt-12 pb-12">
                            <p className="text-center text-slate-400 opacity-60 text-xs italic font-bold tracking-widest">
                                {data.footerText}
                            </p>
                        </div>
                    )
                    }
                </div >
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
